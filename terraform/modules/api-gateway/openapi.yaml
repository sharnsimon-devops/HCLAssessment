swagger: "2.0"
info:
  title: hcl-assessment-services-api
  description: >
    Routes to order-service, application-service (Appointment Service), and
    patient-service. Backend addresses below are placeholders - Phase 5 runs
    before the GKE Ingress (Phase 8) exists, so there is no real address to
    point at yet. Update x-google-backend.address on each path with the
    Ingress external IP/hostname once Phase 8 is applied, then redeploy this
    api-config. Until then, API Gateway responds on its own default URL but
    cannot reach any backend.
  version: 1.0.0
schemes:
  - https
produces:
  - application/json

paths:
  /orders:
    post:
      summary: Create an order (order-service)
      operationId: createOrder
      x-google-backend:
        address: https://placeholder-backend.invalid
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - description
            properties:
              description:
                type: string
      responses:
        "201":
          description: Order created

  /appointments:
    post:
      summary: Schedule an appointment (application-service)
      operationId: createAppointment
      x-google-backend:
        address: https://placeholder-backend.invalid
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - patientId
              - date
              - time
              - doctor
            properties:
              patientId:
                type: string
              date:
                type: string
              time:
                type: string
              doctor:
                type: string
      responses:
        "201":
          description: Appointment scheduled

  /patients:
    post:
      summary: Add a patient (patient-service)
      operationId: createPatient
      x-google-backend:
        address: https://placeholder-backend.invalid
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - name
              - age
            properties:
              name:
                type: string
              age:
                type: integer
              condition:
                type: string
      responses:
        "201":
          description: Patient added
