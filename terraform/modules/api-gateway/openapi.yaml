swagger: "2.0"
info:
  title: hcl-assessment-services-api
  description: >
    Routes to order-service, application-service (Appointment Service), and
    patient-service via the GKE Ingress at 136.69.124.190. x-google-backend
    rejects bare IP addresses ("cannot route requests by IP Address"), so
    the address uses nip.io (136.69.124.190.nip.io), a free public DNS
    service that resolves <ip>.nip.io straight to the embedded IP - no
    domain purchase or DNS zone needed. If the Ingress IP ever changes
    (e.g. the Ingress is recreated), update the .nip.io hostname in all
    three x-google-backend.address values here and redeploy this api-config.
  version: 1.0.0
schemes:
  - https
produces:
  - application/json

paths:
  /orders:
    post:
      summary: Create an order (order-service)
      operationId: createOrder
      x-google-backend:
        address: http://136.69.124.190.nip.io
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - description
            properties:
              description:
                type: string
      responses:
        "201":
          description: Order created

  /appointments:
    post:
      summary: Schedule an appointment (application-service)
      operationId: createAppointment
      x-google-backend:
        address: http://136.69.124.190.nip.io
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - patientId
              - date
              - time
              - doctor
            properties:
              patientId:
                type: string
              date:
                type: string
              time:
                type: string
              doctor:
                type: string
      responses:
        "201":
          description: Appointment scheduled

  /patients:
    post:
      summary: Add a patient (patient-service)
      operationId: createPatient
      x-google-backend:
        address: http://136.69.124.190.nip.io
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - name
              - age
            properties:
              name:
                type: string
              age:
                type: integer
              condition:
                type: string
      responses:
        "201":
          description: Patient added
