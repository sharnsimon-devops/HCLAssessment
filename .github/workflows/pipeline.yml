name: DevSecOps Pipeline

on:
  pull_request:
    branches: [master]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - 'order-service/**'
      - 'application-service/**'
      - 'patient-service/**'
      - '.github/workflows/pipeline.yml'
  push:
    branches: [master]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - 'order-service/**'
      - 'application-service/**'
      - 'patient-service/**'
      - '.github/workflows/pipeline.yml'

env:
  PROJECT_ID: hcl-assessment
  REGION: europe-west2
  REPO: dev-docker-repo
  KEYRING: dev-binauthz-keyring
  SIGNING_KEY: dev-attestor-signing-key
  CLUSTER: dev-gke-cluster
  FLEET_MEMBERSHIP: projects/hcl-assessment/locations/global/memberships/dev-gke-membership
  NAMESPACE: dev

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      order-service: ${{ steps.filter.outputs.order-service }}
      application-service: ${{ steps.filter.outputs.application-service }}
      patient-service: ${{ steps.filter.outputs.patient-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - 'k8s/**'
              - '.checkov.yaml'
              - '.trivyignore'
            order-service:
              - 'order-service/**'
            application-service:
              - 'application-service/**'
            patient-service:
              - 'patient-service/**'

  checkov:
    name: Checkov (Terraform + Kubernetes)
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: false
          skip_check: CKV_GCP_65,CKV_GCP_69,CKV_GCP_42

  trivy-config:
    name: Trivy config scan (replaces deprecated tfsec - checks migrated into Trivy)
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL,HIGH
          exit-code: 1

  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.terraform == 'true'
    needs: [detect-changes, checkov, trivy-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/dev/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n... (truncated)'
              : plan;
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.terraform == 'true'
    needs: [detect-changes, checkov, trivy-config]
    runs-on: ubuntu-latest
    # Requires a one-time manual setup: GitHub repo Settings -> Environments
    # -> create "production" -> add required reviewers. Without that
    # protection rule configured, this job runs immediately with no gate.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve

  order-service:
    name: Build, push, and deploy order-service
    needs: [detect-changes, sonar-scan]
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service:${{ github.sha }} order-service

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service:${{ github.sha }}

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign attestation (build attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-build-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Sign attestation (vulnerability-scan attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-vulnerability-scan-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/order-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/order-service/deployment.yaml
          kubectl rollout status deployment/order-service -n ${{ env.NAMESPACE }} --timeout=180s

  application-service:
    name: Build, push, and deploy application-service
    needs: [detect-changes, sonar-scan]
    if: needs.detect-changes.outputs.application-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service:${{ github.sha }} application-service

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service:${{ github.sha }}

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign attestation (build attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-build-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Sign attestation (vulnerability-scan attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-vulnerability-scan-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/application-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/application-service/deployment.yaml
          kubectl rollout status deployment/application-service -n ${{ env.NAMESPACE }} --timeout=180s

  patient-service:
    name: Build, push, and deploy patient-service
    needs: [detect-changes, sonar-scan]
    if: needs.detect-changes.outputs.patient-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service:${{ github.sha }} patient-service

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service:${{ github.sha }}

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign attestation (build attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-build-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Sign attestation (vulnerability-scan attestor)
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project=${{ env.PROJECT_ID }} \
            --artifact-url=${{ steps.digest.outputs.digest }} \
            --attestor=dev-vulnerability-scan-attestor \
            --attestor-project=${{ env.PROJECT_ID }} \
            --keyversion-project=${{ env.PROJECT_ID }} \
            --keyversion-location=${{ env.REGION }} \
            --keyversion-keyring=${{ env.KEYRING }} \
            --keyversion-key=${{ env.SIGNING_KEY }} \
            --keyversion=1

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/patient-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/patient-service/deployment.yaml
          kubectl rollout status deployment/patient-service -n ${{ env.NAMESPACE }} --timeout=180s

  sonar-scan:
    name: SonarQube SAST + Secrets Scan
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true' || needs.detect-changes.outputs.application-service == 'true' || needs.detect-changes.outputs.patient-service == 'true'
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/api/system/status || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for SonarQube to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[A-Z]*"' | cut -d'"' -f4)
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is up"
              break
            fi
            echo "Waiting for SonarQube... (status: $STATUS)"
            sleep 10
          done

      - name: Generate auth token
        id: sonar-auth
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-token" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile order-service (for accurate Java analysis)
        working-directory: order-service
        run: mvn -B compile -DskipTests

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.token }}
        with:
          args: >
            -Dsonar.projectKey=hcl-devsecops-pipeline
            -Dsonar.sources=order-service/src,application-service/src,patient-service/src
            -Dsonar.java.binaries=order-service/target/classes
            -Dsonar.exclusions=**/node_modules/**,**/target/**

      - name: Check Quality Gate
        run: |
          sleep 10
          STATUS=$(curl -s -u ${{ steps.sonar-auth.outputs.token }}: "http://localhost:9000/api/qualitygates/project_status?projectKey=hcl-devsecops-pipeline" | grep -o '"status":"[A-Z]*"' | head -1 | cut -d'"' -f4)
          echo "Quality Gate status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate failed"
            exit 1
          fi
