name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push"]
    types: [completed]

env:
  PROJECT_ID: hcl-assessment
  REGION: europe-west2
  REPO: dev-docker-repo
  CLUSTER: dev-gke-cluster
  FLEET_MEMBERSHIP: dev-gke-membership
  NAMESPACE: dev

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed services
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      order-service: ${{ steps.filter.outputs.order-service }}
      application-service: ${{ steps.filter.outputs.application-service }}
      patient-service: ${{ steps.filter.outputs.patient-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.workflow_run.head_sha }}~1
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            order-service:
              - 'order-service/**'
            application-service:
              - 'application-service/**'
            patient-service:
              - 'patient-service/**'

  order-service:
    name: Deploy order-service
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service:${{ github.event.workflow_run.head_sha }} --format='value(image_summary.digest)')
          echo "digest=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/order-service@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/order-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/order-service/deployment.yaml
          kubectl rollout status deployment/order-service -n ${{ env.NAMESPACE }} --timeout=180s

  application-service:
    name: Deploy application-service
    needs: detect-changes
    if: needs.detect-changes.outputs.application-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service:${{ github.event.workflow_run.head_sha }} --format='value(image_summary.digest)')
          echo "digest=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/application-service@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/application-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/application-service/deployment.yaml
          kubectl rollout status deployment/application-service -n ${{ env.NAMESPACE }} --timeout=180s

  patient-service:
    name: Deploy patient-service
    needs: detect-changes
    if: needs.detect-changes.outputs.patient-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service:${{ github.event.workflow_run.head_sha }} --format='value(image_summary.digest)')
          echo "digest=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/patient-service@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update manifest image
        run: |
          sed -i "s|image: .*|image: ${{ steps.digest.outputs.digest }}|" k8s/patient-service/deployment.yaml

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          use_connect_gateway: true
          fleet_membership_name: ${{ env.FLEET_MEMBERSHIP }}

      - name: Apply and wait for rollout
        run: |
          kubectl apply -f k8s/patient-service/deployment.yaml
          kubectl rollout status deployment/patient-service -n ${{ env.NAMESPACE }} --timeout=180s
