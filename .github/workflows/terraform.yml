name: Terraform

on:
  pull_request:
    branches: [master]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [master]
    paths:
      - 'terraform/**'
      - 'k8s/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (Terraform + Kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: false

  trivy-config:
    name: Trivy config scan (replaces deprecated tfsec - checks migrated into Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL,HIGH
          exit-code: 1

  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: [checkov, trivy-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/dev/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n... (truncated)'
              : plan;
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checkov, trivy-config]
    runs-on: ubuntu-latest
    # Requires a one-time manual setup: GitHub repo Settings -> Environments
    # -> create "production" -> add required reviewers. Without that
    # protection rule configured, this job runs immediately with no gate.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve
